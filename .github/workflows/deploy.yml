name: Deploy to production

# Runs whenever new code lands on main (a merge or a direct push).
# The workflow starts scripts/deploy.sh on the server via AWS SSM, then polls
# a status file. (A single long, high-output SSM command crashes the SSM
# document worker, so the deploy runs detached and is monitored.)
# No port 22 and no SSH keys are needed.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "data/**"
      - "database/**"
      - "scripts/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Gate: only deploy if the backend tests pass on the exact code being merged.
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    concurrency:
      group: firebreak-production-deployment
      cancel-in-progress: false
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-4

      # Start scripts/deploy.sh on the server in the background, then poll a
      # status file. Running one long, high-output command synchronously
      # crashes the SSM document worker, so the deploy must be detached and
      # monitored instead.
      #
      # `set -e` is the first command on purpose. AWS-RunShellScript reports the
      # exit code of the LAST command in the list, which here is
      # `echo deploy-started` and therefore always succeeds. Without `set -e`,
      # a failure anywhere earlier reads as a successful kickoff -- which is how
      # a failing `git pull` stayed invisible on 2026-09-08.
      - name: Start deploy on server (background)
        id: start
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --region ap-southeast-4 \
            --instance-ids i-060c00865b0bf629e \
            --document-name "AWS-RunShellScript" \
            --comment "Start detached deploy" \
            --parameters '{
              "commands": [
                "set -e",
                "export HOME=/root",
                "cd /home/ubuntu/FIT5120-Assignment-TP03",
                "git config --global --add safe.directory /home/ubuntu/FIT5120-Assignment-TP03",
                "rm -f /var/log/fit5120-deploy.status",
                "git fetch --prune origin",
                "git reset --hard origin/main",
                "setsid bash /home/ubuntu/FIT5120-Assignment-TP03/scripts/deploy.sh > /var/log/fit5120-deploy.log 2>&1 < /dev/null &",
                "echo deploy-started"
              ]
            }' \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "Kickoff command: $CMD_ID"

      - name: Wait for deploy to finish
        env:
          INSTANCE_ID: i-060c00865b0bf629e
          # The kickoff command's id, so we can wait for it to really finish
          # before touching the log/status files it creates.
          KICKOFF_ID: ${{ steps.start.outputs.command_id }}
        run: |
          set -euo pipefail
          REGION=ap-southeast-4

          # Run one short command on the server and return its stdout.
          ssm_run() {
            local cmd_id state
            cmd_id=$(aws ssm send-command \
              --region "$REGION" --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "{\"commands\":[\"$1\"]}" \
              --query 'Command.CommandId' --output text)
            for _ in $(seq 1 30); do
              state=$(aws ssm get-command-invocation \
                --region "$REGION" --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
                --query 'Status' --output text 2>/dev/null || echo Pending)
              case "$state" in Success|Failed|Cancelled|TimedOut) break ;; esac
              sleep 3
            done
            aws ssm get-command-invocation \
              --region "$REGION" --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
              --query 'StandardOutputContent' --output text 2>/dev/null || true
          }

          # send-command is asynchronous: it returns before the kickoff command
          # has actually run on the server. Wait for the kickoff invocation to
          # finish first, otherwise the log file may not exist yet and we would
          # wrongly report "deploy not started" (the NO_LOG race in run #4).
          for _ in $(seq 1 30); do
            state=$(aws ssm get-command-invocation \
              --region "$REGION" --command-id "$KICKOFF_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            echo "Kickoff status: $state"
            case "$state" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 3
          done
          if [ "$state" != "Success" ]; then
            echo "::error::Kickoff command finished with status $state"
            aws ssm get-command-invocation \
              --region "$REGION" --command-id "$KICKOFF_ID" --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' --output text 2>/dev/null || true
            exit 1
          fi
          echo "Kickoff command finished OK"

          # Confirm the background deploy actually started before polling.
          KICK=$(ssm_run "test -f /var/log/fit5120-deploy.log && echo READY || echo NO_LOG")
          echo "Kickoff check: $KICK"
          if [ "$KICK" != "READY" ]; then
            echo "::error::Deploy was not started (background deploy.sh did not write its log)"
            exit 1
          fi

          # The first Historical Fire backfill processes about 628k rows, so
          # allow the detached job up to ~30 minutes while retaining polling.
          for i in $(seq 1 120); do
            RESULT=$(ssm_run "cat /var/log/fit5120-deploy.status 2>/dev/null || echo RUNNING")
            echo "Poll $i: $RESULT"
            if [ "$RESULT" != "RUNNING" ]; then
              if [ "$RESULT" = "0" ]; then
                echo "Deployment succeeded."
                ssm_run "tail -n 25 /var/log/fit5120-deploy.log" || true
                exit 0
              fi
              echo "::error::Deployment failed (exit code $RESULT)"
              ssm_run "tail -n 60 /var/log/fit5120-deploy.log" || true
              exit 1
            fi
            sleep 15
          done
          echo "::error::Deployment timed out after ~30 minutes"
          exit 1
