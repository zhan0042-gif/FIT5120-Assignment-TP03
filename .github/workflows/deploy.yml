name: Deploy to production

# Runs whenever new code lands on main (a merge or a direct push).
# The build/deploy actually happens ON the server via AWS SSM Run Command,
# so no port 22 and no SSH keys are needed.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "data/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Gate: only deploy if the backend tests pass on the exact code being merged.
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-4

      # The server does: pull latest code -> rebuild backend container ->
      # rebuild frontend -> update nginx site dir -> health check.
      # `set -e` makes SSM report Failed on the first error, so a broken
      # deploy never looks like a success.
      - name: Send deploy command to server
        id: send
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --region ap-southeast-4 \
            --instance-ids i-060c00865b0bf629e \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy from GitHub Actions" \
            --parameters '{
              "commands": [
                "set -e",
                "export HOME=/root",
                "cd /home/ubuntu/FIT5120-Assignment-TP03",
                "git config --global --add safe.directory /home/ubuntu/FIT5120-Assignment-TP03",
                "git pull --ff-only origin main",
                "docker compose up -d --build --no-deps backend",
                "docker image prune -f",
                "cd frontend && npm ci && npm run build",
                "sudo cp -r dist/. /var/www/html/",
                "curl -fsS http://localhost:8000/api/health"
              ]
            }' \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command: $CMD_ID"

      - name: Wait for deployment to finish
        env:
          INSTANCE_ID: i-060c00865b0bf629e
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --region ap-southeast-4 \
              --command-id "${{ steps.send.outputs.command_id }}" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "Deployment status: $STATUS (attempt $i)"
            case "$STATUS" in
              Success)
                echo "Deployment succeeded."
                aws ssm get-command-invocation --region ap-southeast-4 \
                  --command-id "${{ steps.send.outputs.command_id }}" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text || true
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "::error::Deployment failed ($STATUS)"
                aws ssm get-command-invocation --region ap-southeast-4 \
                  --command-id "${{ steps.send.outputs.command_id }}" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' --output text || true
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Deployment timed out after 10 minutes"
          exit 1
