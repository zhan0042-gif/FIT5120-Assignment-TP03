name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "database/**"
      - "data/**"
      - "ai/**"
      - "pyproject.toml"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    paths:
      - "backend/**"
      - "database/**"
      - "data/**"
      - "ai/**"
      - "pyproject.toml"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Validate application imports
        env:
          APP_DATA_MODE: mock
        run: python -c "from app.main import app; assert app"

      - name: Run tests
        run: pytest

# Add a disposable MySQL service to this job when database integration tests exist.