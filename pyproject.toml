[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firebreak-spatial-data"
version = "0.1.0"
description = "FIREBREAK Iteration 1 processed spatial lookup package"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["data", "data.scripts", "database", "database.data_migrations"]
