services:
  migration:
    profiles: ["migration"]
    build:
      context: .
      dockerfile: database/Dockerfile.migrations
    environment:
      DATABASE_HOST: ${DATABASE_HOST:-mysql}
      DATABASE_PORT: ${DATABASE_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fit5120}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER-}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD-}

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_DATA_MODE: ${APP_DATA_MODE:-live}
      APP_REPOSITORY_MODE: ${APP_REPOSITORY_MODE:-mysql}
      APP_SPATIAL_MODE: ${APP_SPATIAL_MODE:-data}
      APP_SPATIAL_CACHE_MAX_AGE_HOURS: ${APP_SPATIAL_CACHE_MAX_AGE_HOURS:-24}
      APP_OPEN_DATA_DB_CONNECT_TIMEOUT_SECONDS: ${APP_OPEN_DATA_DB_CONNECT_TIMEOUT_SECONDS:-5}
      APP_OPEN_DATA_DB_READ_TIMEOUT_SECONDS: ${APP_OPEN_DATA_DB_READ_TIMEOUT_SECONDS:-15}
      APP_OPEN_DATA_DB_WRITE_TIMEOUT_SECONDS: ${APP_OPEN_DATA_DB_WRITE_TIMEOUT_SECONDS:-10}
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
      VIC_ROAD_DISRUPTIONS_API_KEY: ${VIC_ROAD_DISRUPTIONS_API_KEY:-}
      DATABASE_HOST: ${DATABASE_HOST:-mysql}
      DATABASE_PORT: ${DATABASE_PORT:-3306}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fit5120}
      MYSQL_USER: ${MYSQL_USER:-fit5120_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      AI_API_KEY: ${AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fit5120}
      MYSQL_USER: ${MYSQL_USER:-fit5120_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_me}
    ports:
      - "${MYSQL_EXPOSED_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
